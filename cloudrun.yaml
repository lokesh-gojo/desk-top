apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: easa-deskbot
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/easa-deskbot:latest
        ports:
        - name: http1
          containerPort: 8000
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
        env:
        - name: LLM_PROVIDER
          value: "gemini"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: easa-gemini-key
              key: latest
        - name: MIN_EVIDENCE_CONFIDENCE
          value: "0.45"
